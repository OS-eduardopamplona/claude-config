<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Ledger: summary strip, then one sortable row per ticket with inline bars, then the worker timeline. */
:root {
  --plane: #f4f6f9;
  --surface: #ffffff;
  --ink: #0f1521;
  --ink-2: #4a5468;
  --ink-3: #6f7a8e;
  --rule: #dde2ea;
  --track: #eceff4;
  --cost: #2a78d6;
  --ci: #eb6834;
  --good: #0ca30c;
  --review: #6250d6;
  --warn: #c98500;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #0b0e13; --surface: #141921; --ink: #eef1f6; --ink-2: #b6becc; --ink-3: #8a94a6;
    --rule: #283040; --track: #1f2632; --cost: #3987e5; --ci: #d95926; --good: #2bb52b; --review: #9085e9; --warn: #eda100;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0b0e13; --surface: #141921; --ink: #eef1f6; --ink-2: #b6becc; --ink-3: #8a94a6;
  --rule: #283040; --track: #1f2632; --cost: #3987e5; --ci: #d95926; --good: #2bb52b; --review: #9085e9; --warn: #eda100;
}
* { box-sizing: border-box; }
body {
  background: var(--plane); color: var(--ink); font: 400 14px/1.5 var(--body);
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1240px; margin: 0 auto; display: grid; gap: 28px; }
header { display: grid; gap: 6px; }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
h1 { margin: 0; font: 800 clamp(30px, 5vw, 46px)/1 var(--display); font-stretch: 68%; letter-spacing: -.01em; text-wrap: balance; }
h2 { margin: 0; font: 700 20px/1.2 var(--display); font-stretch: 75%; text-wrap: balance; }
.lede { margin: 0; color: var(--ink-2); max-width: 68ch; }
a { color: var(--cost); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--cost); outline-offset: 2px; border-radius: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--rule); background: var(--surface); }
.stat { padding: 14px 16px; display: grid; gap: 4px; border-right: 1px solid var(--rule); }
.stat:last-child { border-right: 0; }
.stat .v { font: 500 24px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--ink-2); }
.stat .s { font: 400 11px/1.3 var(--mono); color: var(--ink-3); }

section { display: grid; gap: 12px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); }
table { width: 100%; border-collapse: collapse; min-width: 980px; }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--cost) 5%, transparent); }
th { font: 500 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
th button { all: unset; cursor: pointer; }
th button:hover { color: var(--ink); }
th[aria-sort] button { color: var(--ink); }
th[aria-sort="descending"] button::after { content: " \2193"; }
th[aria-sort="ascending"] button::after { content: " \2191"; }
td.r, th.r { text-align: right; }
.key { font: 500 13px/1.2 var(--mono); white-space: nowrap; }
.sum { color: var(--ink-2); font-size: 12.5px; max-width: 38ch; margin-top: 2px; }
.orch td { background: color-mix(in srgb, var(--ink) 3%, transparent); }

.chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12.5px; }
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; box-sizing: border-box; }
.chip.done { color: var(--good); } .chip.done::before { background: currentColor; }
.chip.review { color: var(--review); } .chip.review::before { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.chip.progress { color: var(--cost); }
.chip.todo { color: var(--ink-3); } .chip.todo::before { border-style: dashed; }
.chip.discarded { color: var(--ink-3); text-decoration: line-through; } .chip.discarded::before { border-color: transparent; background: var(--ink-3); border-radius: 1px; height: 2px; }
.chip.none { color: var(--ink-3); } .chip.none::before { display: none; }
.chip span { color: var(--ink); } .chip.todo span, .chip.discarded span, .chip.none span { color: var(--ink-2); }

.bar { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; min-width: 150px; }
.bar .t { height: 8px; background: var(--track); border-radius: 0 4px 4px 0; overflow: hidden; }
.bar .f { height: 100%; border-radius: 0 4px 4px 0; }
.bar .n { font: 500 12.5px/1 var(--mono); font-variant-numeric: tabular-nums; min-width: 6ch; text-align: right; }
.sub { font: 400 11px/1.3 var(--mono); color: var(--ink-3); margin-top: 3px; }
.prs { display: flex; flex-wrap: wrap; gap: 4px 8px; font: 400 12.5px/1.3 var(--mono); }
.prs .st { color: var(--ink-3); font-size: 11px; }

.timeline svg { display: block; width: 100%; min-width: 820px; height: auto; }
.timeline text { font-family: var(--mono); font-size: 11px; fill: var(--ink-2); }
.timeline .grid { stroke: var(--rule); stroke-width: 1; }
.timeline .span { fill: var(--cost); }
.timeline .span:hover { fill: var(--ci); }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px 32px; color: var(--ink-2); font-size: 13px; }
.notes ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.notes code { font: 400 12px/1.4 var(--mono); color: var(--ink); }
.notes h3 { margin: 0; font: 500 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

#tip { position: fixed; pointer-events: none; z-index: 20; max-width: 300px; padding: 8px 10px; background: var(--ink); color: var(--plane); font: 400 12px/1.45 var(--body); border-radius: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
#tip b { font-weight: 600; }
#tip .m { font-family: var(--mono); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { .bar .f { transition: width .3s ease-out; } }
</style>

<div class="page">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="strip" id="strip" aria-label="Totals"></div>

  <section>
    <div class="head">
      <h2>Per ticket</h2>
      <div class="legend"><span><i style="background:var(--cost)"></i>Claude spend, list price</span><span><i style="background:var(--ci)"></i>CI agent minutes on the ticket's PRs</span></div>
    </div>
    <div class="scroll"><table id="table"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
  </section>

  <section class="timeline">
    <div class="head">
      <h2>When the workers ran</h2>
      <div class="legend"><span>One bar per local session, from its start to its last activity (UTC). Hover for its cost.</span></div>
    </div>
    <div class="scroll" id="tl"></div>
  </section>

  <section class="notes" id="notes"></section>
</div>
<div id="tip" hidden></div>

<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd = v => "$" + (v >= 100 ? v.toFixed(0) : v.toFixed(2));
const hrs = m => (m / 60).toFixed(1);
const fmtN = v => v >= 1e9 ? (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? (v / 1e3).toFixed(0) + "k" : String(v);
const when = s => new Date(s).toLocaleString("en-GB", { timeZone: "UTC", weekday: "short", day: "2-digit", hour: "2-digit", minute: "2-digit" });
const tokTotal = t => Object.values(t).reduce((a, b) => a + b, 0);
const T = DATA.tickets;
const isOrch = t => t.key === "orchestration";

$("eyebrow").textContent = `Orchestration telemetry · since ${DATA.since || "all time"} · generated ${when(DATA.generatedAt)} UTC`;
$("title").textContent = `${DATA.rootTicket || ""} Ledger`.trim();
const workers = T.filter(t => !isOrch(t));
$("lede").textContent = `What the ${DATA.rootTicket || "orchestrator"} orchestrator and its ${workers.reduce((a, t) => a + t.sessions, 0)} worker sessions spent across ${workers.length} tickets: Claude tokens at list price, the CI their PRs ran, review rounds and where each ticket stands in Jira.`;

const sum = f => T.reduce((a, t) => a + f(t), 0);
const prs = T.flatMap(t => t.prs);
const merged = prs.filter(p => p.state === "MERGED").length;
const done = workers.filter(t => t.status === "Done").length;
const orch = T.find(isOrch);
const tokens = sum(t => tokTotal(t.tokens));
const cacheRead = sum(t => t.tokens.cache_read || 0);
const stats = [
  [usd(sum(t => t.cost)), "Claude spend", orch ? `orchestrator ${usd(orch.cost)}` : ""],
  [fmtN(sum(t => t.requests)), "Model requests", `${fmtN(tokens)} tokens · ${Math.round(100 * cacheRead / Math.max(tokens, 1))}% cache reads`],
  [hrs(sum(t => t.active)), "Active hours", "gaps over 5 min not counted"],
  [hrs(sum(t => t.ciMin)), "CI agent hours", `${sum(t => t.ciRuns)} runs · ${sum(t => t.ciReruns)} reruns`],
  [`${merged}/${prs.length}`, "PRs merged", `${sum(t => t.reviews)} human reviews`],
  [`${done}/${workers.length}`, "Tickets done", `${workers.filter(t => t.status === "In Code Review").length} in code review`],
];
$("strip").innerHTML = stats.map(([v, k, s]) => `<div class="stat"><div class="v">${esc(v)}</div><div class="k">${esc(k)}</div><div class="s">${esc(s)}</div></div>`).join("");

const chipClass = s => !s ? "none" : /done/i.test(s) ? "done" : /review/i.test(s) ? "review" : /progress/i.test(s) ? "progress" : /discard|cancel/i.test(s) ? "discarded" : "todo";
const maxCost = Math.max(...T.map(t => t.cost), 1);
const maxCi = Math.max(...T.map(t => t.ciMin), 1);
const cols = [
  ["key", "Ticket", t => t.key, false],
  ["status", "Jira", t => t.status || "", false],
  ["sessions", "Sessions", t => t.sessions + t.cloud, true],
  ["cost", "Spend", t => t.cost, true],
  ["active", "Active h", t => t.active, true],
  ["wall", "Wall h", t => t.wall ?? 0, true],
  ["ciMin", "CI min", t => t.ciMin, true],
  ["reviews", "Reviews", t => t.reviews, true],
  ["cycle", "Cycle d", t => t.cycle ?? -1, true],
  ["prs", "PRs", t => t.prs.length, false],
];
let sortKey = "cost", sortDir = -1;
function row(t) {
  const tk = tokTotal(t.tokens);
  const costTip = `<b>${esc(t.key)}</b><br><span class="m">${usd(t.cost)} · ${t.requests} requests<br>${fmtN(tk)} tokens: ${fmtN(t.tokens.cache_read)} cache read, ${fmtN(t.tokens.cache_write_5m + t.tokens.cache_write_1h)} cache write, ${fmtN(t.tokens.output)} output, ${fmtN(t.tokens.input)} input</span>`;
  const ciTip = `<b>CI on ${t.prs.length} PR${t.prs.length === 1 ? "" : "s"}</b><br><span class="m">${t.ciRuns} runs · ${t.ciReruns} reruns · ${t.ciFailed} failed<br>${t.prs.map(p => `${esc(p.ref)}: ${p.ci ? `${p.ci.runs} runs, ${p.ci.minutes} min (${p.ci.source})` : "no data"}`).join("<br>")}</span>`;
  const sessTip = t.spans.map(s => `${esc(s.title)}<br><span class="m">${usd(s.cost || 0)} · ${hrs(s.active || 0)} h active</span>`).join("<br>") + (t.cloud ? `<br>+${t.cloud} cloud session${t.cloud > 1 ? "s" : ""}, not costed` : "");
  const keyCell = isOrch(t) ? `<div class="key">${esc(DATA.rootTicket || "")} orchestrator</div><div class="sum">${esc(DATA.rootTitle)}</div>`
    : `<div class="key">${esc(t.key)}</div><div class="sum">${esc(t.summary || "Not in the Jira cache")}</div>`;
  return `<tr class="${isOrch(t) ? "orch" : ""}">
    <td>${keyCell}</td>
    <td><span class="chip ${chipClass(t.status)}"><span>${esc(t.status || "n/a")}</span></span></td>
    <td class="r num" data-tip="${esc(sessTip)}">${t.sessions}${t.cloud ? `<div class="sub">+${t.cloud} cloud</div>` : ""}</td>
    <td data-tip="${esc(costTip)}"><div class="bar"><div class="t"><div class="f" style="width:${100 * t.cost / maxCost}%;background:var(--cost)"></div></div><div class="n">${usd(t.cost)}</div></div><div class="sub">${t.requests} req · ${fmtN(tk)} tok</div></td>
    <td class="r num">${hrs(t.active)}</td>
    <td class="r num">${t.wall == null ? "–" : t.wall.toFixed(1)}</td>
    <td data-tip="${esc(ciTip)}"><div class="bar"><div class="t"><div class="f" style="width:${100 * t.ciMin / maxCi}%;background:var(--ci)"></div></div><div class="n">${t.ciMin ? t.ciMin.toFixed(0) : "–"}</div></div><div class="sub">${t.ciRuns ? `${t.ciRuns} runs${t.ciReruns ? ` · ${t.ciReruns} rerun${t.ciReruns > 1 ? "s" : ""}` : ""}${t.ciFailed ? ` · ${t.ciFailed} failed` : ""}` : "no runs"}</div></td>
    <td class="r num">${t.reviews || "–"}</td>
    <td class="r num">${t.cycle == null ? "–" : t.cycle.toFixed(1)}</td>
    <td><div class="prs">${t.prs.map(p => `<span><a href="${esc(p.url)}" target="_blank" rel="noopener" data-tip="${esc(p.title)}">${esc(p.ref)}</a> <span class="st">${esc((p.state || "").toLowerCase())}${p.draft ? " draft" : ""}</span></span>`).join("") || `<span class="st">none yet</span>`}</div></td>
  </tr>`;
}
function render() {
  $("thead").innerHTML = cols.map(([k, label, , right]) => `<th class="${right ? "r" : ""}" ${k === sortKey ? `aria-sort="${sortDir < 0 ? "descending" : "ascending"}"` : ""}><button type="button" id="sort-${k}" data-k="${k}">${label}</button></th>`).join("");
  const get = cols.find(c => c[0] === sortKey)[2];
  const rows = [...T].sort((a, b) => isOrch(a) - isOrch(b) || (get(a) > get(b) ? 1 : get(a) < get(b) ? -1 : 0) * sortDir);
  $("tbody").innerHTML = rows.map(row).join("");
}
$("thead").addEventListener("click", e => {
  const k = e.target.closest("button")?.dataset.k; if (!k) return;
  sortDir = k === sortKey ? -sortDir : (cols.find(c => c[0] === k)[3] ? -1 : 1); sortKey = k; render();
});
render();

(function timeline() {
  const lanes = [...T].filter(t => t.spans.some(s => s.start)).sort((a, b) => isOrch(b) - isOrch(a) || new Date(Math.min(...a.spans.map(s => +new Date(s.start)))) - new Date(Math.min(...b.spans.map(s => +new Date(s.start)))));
  const lo = DATA.since ? +new Date(DATA.since + "T00:00:00Z") : Math.min(...lanes.flatMap(t => t.spans.map(s => +new Date(s.start))));
  const hi = Math.ceil(+new Date(DATA.generatedAt) / 36e5) * 36e5;
  const W = 1200, L = 150, R = 16, top = 26, lane = 18, H = top + lanes.length * lane + 8;
  const x = v => L + (Math.min(Math.max(v, lo), hi) - lo) / (hi - lo) * (W - L - R);
  const step = (hi - lo) / 36e5 > 36 ? 6 : 3;
  let g = "";
  for (let v = Math.ceil(lo / (step * 36e5)) * step * 36e5; v <= hi; v += step * 36e5) {
    const d = new Date(v), label = d.getUTCHours() === 0 ? d.toLocaleDateString("en-GB", { timeZone: "UTC", weekday: "short", day: "2-digit" }) : String(d.getUTCHours()).padStart(2, "0") + ":00";
    g += `<line class="grid" x1="${x(v)}" x2="${x(v)}" y1="${top - 6}" y2="${H}"${d.getUTCHours() ? ' stroke-dasharray="2 3"' : ""}/><text x="${x(v)}" y="${top - 12}" text-anchor="middle">${label}</text>`;
  }
  lanes.forEach((t, i) => {
    const y = top + i * lane;
    g += `<text x="${L - 10}" y="${y + 12}" text-anchor="end">${esc(isOrch(t) ? "orchestrator" : t.key)}</text>`;
    t.spans.filter(s => s.start && s.end && +new Date(s.end) > lo).forEach(s => {
      const a = x(+new Date(s.start)), b = Math.max(x(+new Date(s.end)), a + 3);
      const tip = `<b>${esc(s.title)}</b><br><span class="m">${when(s.start)} → ${when(s.end)} UTC<br>${usd(s.cost || 0)} · ${hrs(s.active || 0)} h active · ${s.requests} req</span>`;
      g += `<rect class="span" x="${a}" y="${y + 4}" width="${b - a}" height="10" rx="2" fill="var(--cost)" data-tip="${esc(tip)}"/>`;
    });
  });
  $("tl").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Session spans per ticket">${g}</svg>`;
})();

$("notes").innerHTML = `<div><h3>What the numbers leave out</h3><ul>${DATA.gaps.map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>
<div><h3>Sources</h3><ul>
<li>Tokens and cost: local transcripts under <code>~/.claude/projects</code>, subagents included, deduplicated by message id.</li>
<li>Sessions: the desktop app's session records, from the orchestrator <code>${esc(DATA.root.slice(0, 14))}…</code> down.</li>
<li>PRs and reviews: <code>gh pr view</code>. CI: Azure DevOps definitions 432 and 298, GitHub Actions elsewhere.</li>
<li>Jira: cached ${DATA.jiraFetchedAt ? when(DATA.jiraFetchedAt) + " UTC" : "never"}; cycle is created to resolved, or to now.</li>
</ul></div>`;

const tip = $("tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest("[data-tip]");
  if (!el || !el.dataset.tip) { tip.hidden = true; return; }
  tip.innerHTML = el.dataset.tip; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 8) + "px";
  tip.style.top = (e.clientY + 16 + r.height > innerHeight ? e.clientY - r.height - 12 : e.clientY + 16) + "px";
});
</script>
